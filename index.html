<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover deixa o mapa ocupar a tela toda no iPhone; a UI usa env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Minimapa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Navegação GPS com visual de minimapa de jogo." />
    <!-- Ícones gerados de public/icon.svg (npm run icons); o manifest é injetado pelo vite-plugin-pwa -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Minimapa GPS</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
